<section id="login" class="mb-5">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-sm-6 col-md-4 mx-auto">
        <div class="card_login">
          <div class="card">
            <div class="card-body text-center">
              <form #formloginUser="ngForm" (ngSubmit)="login()">
                <h1 class="h3 mb-4 font-weight-bold" style="color: #fff;">Welcome Back</h1>
                
                <div class="form-floating mb-3">
                  <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com"
                    [(ngModel)]="user.email" required>
                  <label for="email">Email address</label>
                </div>
                
                <div class="form-floating mb-4">
                  <input type="password" id="password" name="password" class="form-control" placeholder="Password"
                    [(ngModel)]="user.password" required>
                  <label for="password">Password</label>
                </div>
                
                <button class="btn btn-lg btn-primary w-100 mb-3">Login</button>
                
                <div class="text-center mt-3">
                  <a routerLink="" class="text-decoration-none">Forgot password?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
