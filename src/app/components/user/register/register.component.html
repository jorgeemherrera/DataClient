<section id="register" class="mb-5">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-sm-6 col-md-4 mx-auto">
        <div class="card_register">
          <div class="card">
            <div class="card-body text-center">
              <form #formRegisterUser="ngForm" (ngSubmit)="register()">
                  <h1 class="h3 mb-4 font-weight-bold" style="color: #fff;">Create Account</h1>
                  
                  <div class="row">
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" id="name" name="name" class="form-control" placeholder="First Name" [(ngModel)]="user.name" required>
                        <label for="name">First Name</label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-floating mb-3">
                        <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Last Name" [(ngModel)]="user.lastName" required>
                        <label for="lastName">Last Name</label>
                      </div>
                    </div>
                  </div>

                  <div class="form-floating mb-3">
                    <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone" [(ngModel)]="user.phone" [ngModelOptions]="{standalone: true}" required>
                    <label for="phone">Phone Number</label>
                  </div>

                  <div class="form-floating mb-3">
                    <input type="date" id="birthday" name="birthday" class="form-control" placeholder="Birthday" [(ngModel)]="user.birthday" [ngModelOptions]="{standalone: true}" required>
                    <label for="birthday">Birthday</label>
                  </div>

                  <div class="mb-3 text-start">
                    <label for="picture" class="form-label" style="color: var(--text-muted); font-size: 0.9rem; padding-left: 0.5rem;">Profile Picture</label>
                    <input type="file" class="form-control" id="picture" [(ngModel)]="user.picture">
                  </div>

                  <div class="form-floating mb-3">
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" [(ngModel)]="user.email" required>
                    <label for="email">Email address</label>
                  </div>

                  <div class="form-floating mb-4">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" [(ngModel)]="user.password" required>
                    <label for="password">Password</label>
                  </div>

                  <button class="btn btn-lg btn-primary w-100 mb-3">Register</button>
                  
                  <div class="text-center mt-3">
                    <a routerLink="/user/login" class="text-decoration-none">Already have an account? Login</a>
                  </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
